services:
  - type: web
    name: cf-manager
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        fromService:
          type: web
          name: cf-manager
          property: host
      - key: SESSION_DRIVER
        value: cookie
      - key: SESSION_LIFETIME
        value: "43200"
      - key: SESSION_EXPIRE_ON_CLOSE
        value: "false"
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: SESSION_SAME_SITE
        value: lax
      - key: SESSION_PATH
        value: /
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync
